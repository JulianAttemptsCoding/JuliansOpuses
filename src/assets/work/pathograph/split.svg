<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="Schematic of the chronological split: a long training period, then validation, then a held-out test period, in time order.">
  <defs>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#15161a"/>
    </marker>
  </defs>

  <rect x="40" y="64" width="520" height="46" fill="#f3f2ee" stroke="#15161a" stroke-width="1.25"/>
  <rect x="560" y="64" width="130" height="46" fill="#ffffff" stroke="#15161a" stroke-width="1.25"/>
  <rect x="690" y="64" width="130" height="46" fill="#c2410c" fill-opacity="0.12" stroke="#c2410c" stroke-width="1.5"/>

  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#15161a" text-anchor="middle">
    <text x="300" y="91">TRAIN</text>
    <text x="625" y="91">VALIDATION</text>
    <text x="755" y="91" fill="#9a3412">HELD-OUT TEST</text>
  </g>

  <path d="M40 130H848" stroke="#15161a" stroke-width="1.25" fill="none" marker-end="url(#sp-arrow)"/>
  <g stroke="#15161a" stroke-width="1.25">
    <path d="M40 124V136M560 124V136M690 124V136M820 124V136"/>
  </g>

  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6a6c74">
    <text x="40" y="46">every boundary is a date, never a random row</text>
    <text x="560" y="31">checkpoint chosen here,</text>
    <text x="560" y="46">on validation AUROC</text>
    <text x="848" y="152" text-anchor="end">time</text>
    <text x="690" y="170" fill="#9a3412">scored from the frozen</text>
    <text x="690" y="185" fill="#9a3412">checkpoint and config</text>
    <text x="40" y="170">model trains on this period only</text>
  </g>
</svg>
