<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Schematic of the PathoGraph pipeline: trade, climate and outbreak reports feed a country graph per time step, which a spatio-temporal graph network turns into calibrated risk per country and pathogen.">
  <defs>
    <marker id="pg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#15161a"/>
    </marker>
  </defs>

  <!-- Inputs -->
  <g fill="#ffffff" stroke="#15161a" stroke-width="1.25">
    <rect x="16" y="46" width="170" height="58" rx="8"/>
    <rect x="16" y="141" width="170" height="58" rx="8"/>
    <rect x="16" y="236" width="170" height="58" rx="8"/>
  </g>
  <g font-family="'Geist Variable', system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#15161a">
    <text x="30" y="71">Trade</text>
    <text x="30" y="166">Climate</text>
    <text x="30" y="261">Outbreak reports</text>
  </g>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6a6c74">
    <text x="30" y="89">flows between countries</text>
    <text x="30" y="184">conditions over time</text>
    <text x="30" y="279">labels, ~8 pathogens</text>
  </g>
  <g stroke="#15161a" stroke-width="1.25" fill="none" marker-end="url(#pg-arrow)">
    <path d="M186 75H236"/>
    <path d="M186 170H236"/>
    <path d="M186 265H236"/>
  </g>

  <!-- Country graph, one per time step -->
  <rect x="264" y="34" width="230" height="236" rx="8" fill="#ffffff" stroke="#d9d7cf" stroke-width="1.25"/>
  <rect x="254" y="44" width="230" height="236" rx="8" fill="#ffffff" stroke="#d9d7cf" stroke-width="1.25"/>
  <rect x="244" y="54" width="230" height="236" rx="8" fill="#ffffff" stroke="#15161a" stroke-width="1.25"/>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6a6c74" text-anchor="end">
    <text x="488" y="29">t−2</text>
    <text x="478" y="39">t−1</text>
    <text x="466" y="71" fill="#15161a">t</text>
  </g>
  <g stroke="#b9b7ae" stroke-width="1" fill="none">
    <path d="M285 105L330 85L385 110L440 95M285 105L300 165M330 85L355 150M385 110L415 170M440 95L450 140M300 165L290 235M415 170L400 240M450 140L445 215M415 170L450 140M290 235L345 215M400 240L445 215M330 85L450 140"/>
  </g>
  <g stroke="#c2410c" stroke-width="1.5" fill="none">
    <path d="M355 150L385 110M355 150L300 165M355 150L415 170M355 150L345 215M355 150L400 240"/>
  </g>
  <g fill="#15161a">
    <circle cx="285" cy="105" r="5"/><circle cx="330" cy="85" r="5"/><circle cx="385" cy="110" r="5"/><circle cx="440" cy="95" r="5"/>
    <circle cx="300" cy="165" r="5"/><circle cx="415" cy="170" r="5"/><circle cx="450" cy="140" r="5"/>
    <circle cx="290" cy="235" r="5"/><circle cx="345" cy="215" r="5"/><circle cx="400" cy="240" r="5"/><circle cx="445" cy="215" r="5"/>
  </g>
  <circle cx="355" cy="150" r="7" fill="#c2410c" stroke="#ffffff" stroke-width="2"/>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6a6c74">
    <text x="244" y="312">~194 countries as nodes, trade as edges</text>
    <text x="244" y="328">one graph per time step</text>
  </g>

  <!-- Model -->
  <path d="M494 162H522" stroke="#15161a" stroke-width="1.25" fill="none" marker-end="url(#pg-arrow)"/>
  <rect x="530" y="112" width="150" height="100" rx="8" fill="#15161a"/>
  <text x="605" y="155" text-anchor="middle" font-family="'Geist Variable', system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff">ST-MM-GNN</text>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#c9c8c2" text-anchor="middle">
    <text x="605" y="176">graph layers</text>
    <text x="605" y="190">+ temporal encoder</text>
  </g>
  <path d="M680 162H718" stroke="#15161a" stroke-width="1.25" fill="none" marker-end="url(#pg-arrow)"/>

  <!-- Output: risk per country x pathogen (illustrative shading) -->
  <g fill="#c2410c">
    <g fill-opacity="0.08">
      <rect x="730" y="100" width="14" height="14" rx="2"/><rect x="747" y="100" width="14" height="14" rx="2"/><rect x="781" y="100" width="14" height="14" rx="2"/><rect x="798" y="100" width="14" height="14" rx="2"/><rect x="815" y="100" width="14" height="14" rx="2"/><rect x="849" y="100" width="14" height="14" rx="2"/>
      <rect x="730" y="117" width="14" height="14" rx="2"/><rect x="764" y="117" width="14" height="14" rx="2"/><rect x="781" y="117" width="14" height="14" rx="2"/><rect x="798" y="117" width="14" height="14" rx="2"/><rect x="832" y="117" width="14" height="14" rx="2"/><rect x="849" y="117" width="14" height="14" rx="2"/>
      <rect x="730" y="134" width="14" height="14" rx="2"/><rect x="747" y="134" width="14" height="14" rx="2"/><rect x="764" y="134" width="14" height="14" rx="2"/><rect x="798" y="134" width="14" height="14" rx="2"/><rect x="815" y="134" width="14" height="14" rx="2"/><rect x="832" y="134" width="14" height="14" rx="2"/><rect x="849" y="134" width="14" height="14" rx="2"/>
      <rect x="747" y="151" width="14" height="14" rx="2"/><rect x="764" y="151" width="14" height="14" rx="2"/><rect x="781" y="151" width="14" height="14" rx="2"/><rect x="815" y="151" width="14" height="14" rx="2"/><rect x="832" y="151" width="14" height="14" rx="2"/><rect x="849" y="151" width="14" height="14" rx="2"/>
      <rect x="730" y="168" width="14" height="14" rx="2"/><rect x="747" y="168" width="14" height="14" rx="2"/><rect x="764" y="168" width="14" height="14" rx="2"/><rect x="781" y="168" width="14" height="14" rx="2"/><rect x="798" y="168" width="14" height="14" rx="2"/><rect x="832" y="168" width="14" height="14" rx="2"/>
      <rect x="730" y="185" width="14" height="14" rx="2"/><rect x="764" y="185" width="14" height="14" rx="2"/><rect x="781" y="185" width="14" height="14" rx="2"/><rect x="798" y="185" width="14" height="14" rx="2"/><rect x="815" y="185" width="14" height="14" rx="2"/><rect x="832" y="185" width="14" height="14" rx="2"/><rect x="849" y="185" width="14" height="14" rx="2"/>
    </g>
    <g fill-opacity="0.3">
      <rect x="764" y="100" width="14" height="14" rx="2"/><rect x="815" y="117" width="14" height="14" rx="2"/><rect x="730" y="151" width="14" height="14" rx="2"/><rect x="849" y="168" width="14" height="14" rx="2"/><rect x="747" y="185" width="14" height="14" rx="2"/>
    </g>
    <g fill-opacity="0.9">
      <rect x="832" y="100" width="14" height="14" rx="2"/><rect x="747" y="117" width="14" height="14" rx="2"/><rect x="781" y="134" width="14" height="14" rx="2"/><rect x="798" y="151" width="14" height="14" rx="2"/><rect x="815" y="168" width="14" height="14" rx="2"/>
    </g>
  </g>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6a6c74">
    <text x="730" y="90">pathogens →</text>
    <text x="730" y="220" fill="#15161a">risk, country × pathogen</text>
    <text x="730" y="236">calibrated probability</text>
  </g>
</svg>
