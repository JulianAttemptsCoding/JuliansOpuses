<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 610" role="img" aria-label="Sequence diagram of a visit: the browser shell signs in with Google through Supabase, checks access, submits the shared password for server-side verification, receives a manifest and short-lived signed URLs, downloads the editor from a private bucket, and verifies every asset with SHA-256 before running it.">
  <defs>
    <marker id="au-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#15161a"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <g stroke="#d9d7cf" stroke-width="1.25" stroke-dasharray="4 5">
    <path d="M150 72V520M470 72V452M770 72V520"/>
  </g>

  <!-- Participants -->
  <g fill="#ffffff" stroke="#15161a" stroke-width="1.25">
    <rect x="40" y="16" width="220" height="56" rx="8"/>
    <rect x="660" y="16" width="200" height="56" rx="8"/>
  </g>
  <rect x="360" y="16" width="220" height="56" rx="8" fill="#15161a"/>
  <g font-family="'Geist Variable', system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="500" text-anchor="middle">
    <text x="150" y="40" fill="#15161a">Browser</text>
    <text x="470" y="40" fill="#ffffff">Supabase</text>
    <text x="760" y="40" fill="#15161a">Private bucket</text>
  </g>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
    <text x="150" y="58" fill="#6a6c74">static shell · GitHub Pages</text>
    <text x="470" y="58" fill="#c9c8c2">Auth · Edge Functions</text>
    <text x="760" y="58" fill="#6a6c74">editor bundle</text>
  </g>

  <!-- Requests (solid) -->
  <g stroke="#15161a" stroke-width="1.25" fill="none" marker-end="url(#au-arrow)">
    <path d="M150 112H468"/>
    <path d="M150 202H468"/>
    <path d="M150 292H468"/>
    <path d="M150 382H468"/>
    <path d="M150 472H768"/>
  </g>
  <!-- Responses (dashed) -->
  <g stroke="#15161a" stroke-width="1.25" stroke-dasharray="5 4" fill="none" marker-end="url(#au-arrow)">
    <path d="M470 152H152"/>
    <path d="M470 242H152"/>
    <path d="M470 332H152"/>
    <path d="M470 422H152"/>
    <path d="M770 512H152"/>
  </g>

  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#15161a" text-anchor="middle">
    <text x="310" y="104">Continue with Google</text>
    <text x="310" y="144">session</text>
    <text x="310" y="194">check-site-access</text>
    <text x="310" y="234">{ hasAccess: false }</text>
    <text x="310" y="284">verify-site-password</text>
    <text x="310" y="324">{ ok, expiresAt }</text>
    <text x="310" y="374">get-protected-app</text>
    <text x="310" y="414">manifest + signed URLs</text>
    <text x="460" y="464">fetch assets with signed URLs</text>
    <text x="460" y="504">asset bytes</text>
  </g>

  <!-- Server-side notes -->
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#6a6c74">
    <text x="486" y="116">PKCE; identity verified server-side</text>
    <text x="486" y="206">reads site_access_grants</text>
    <text x="486" y="290">PBKDF2 ×310,000, constant-time</text>
    <text x="486" y="305">5 failures / 15 min, never logged</text>
    <text x="486" y="336" fill="#9a3412">writes the grant</text>
    <text x="486" y="386">re-checks the grant, then signs</text>
    <text x="486" y="426" fill="#9a3412">URLs expire in 5 minutes</text>
  </g>

  <!-- Client-side verification -->
  <rect x="40" y="540" width="500" height="56" rx="8" fill="#c2410c" fill-opacity="0.1" stroke="#c2410c" stroke-width="1.25"/>
  <g font-family="'Geist Mono Variable', ui-monospace, Menlo, Consolas, monospace" font-size="11.5">
    <text x="56" y="564" fill="#15161a">SHA-256 every asset against the manifest</text>
    <text x="56" y="582" fill="#9a3412">any mismatch: refuse to execute · all match: run the bundle</text>
  </g>
</svg>
