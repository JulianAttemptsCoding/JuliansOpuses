name: Build and deploy

# Every push to main is type-checked and built. Publishing to GitHub Pages happens
# only when this workflow is run by hand (Actions → Build and deploy → Run workflow),
# or on every push once the repository variable PAGES_AUTO_DEPLOY is set to "true".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      # A user site (<name>.github.io) is served from '/'; any other repository
      # is served from '/<repo-name>/'.
      - name: Plan the build
        id: plan
        env:
          AUTO_DEPLOY: ${{ vars.PAGES_AUTO_DEPLOY }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "push" && "$AUTO_DEPLOY" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.plan.outputs.base }}

      - if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
